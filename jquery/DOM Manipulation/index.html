<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

      <script src="http://code.jquery.com/jquery-4.0.0.js"></script>

    
    

</head>
<body>
    
    <img id-="image" src="logo.png" alt="logo">

      <div id="parent">
        <p>one</p>
      </div>
   
      <div id="to-remove">
        bye dear
      </div>

    <script>
        //Attr()
        $("#image").attr("alt","new logo");

        //append
        $("#parent").append("<p>two</p>");
        $("#parent").append("<p>three</p>");

        //prepend
        $("#parent").prepend("<p>text 33</p>");

        //remove
        $("#to-remove").remove("");

    </script>
</body>
</html>
